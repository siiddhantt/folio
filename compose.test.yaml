services:
  postgres:
    platform: linux/amd64
    image: folio-postgres:local
    build: {context: ., dockerfile: docker/postgres.Dockerfile}
    environment:
      POSTGRES_USER: folio
      POSTGRES_PASSWORD: folio
      POSTGRES_DB: folio_test
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U folio -d folio_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    platform: linux/amd64
    image: redis:8@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:56379:6379"]
